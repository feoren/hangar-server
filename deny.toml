# cargo-deny: where crates may come from and under which licenses. Known vulnerabilities are
# checked by cargo-audit in CI (docs/dependencies.md).

[graph]
all-features = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    # Unicode data tables (ICU crates behind `idna`).
    "Unicode-3.0",
    # The CA list in `webpki-roots`.
    "CDLA-Permissive-2.0",
]

# The server itself.
[[licenses.exceptions]]
crate = "hangar-server"
allow = ["Elastic-2.0"]
