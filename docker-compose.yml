# Running on a VPS or Docker host: Hangar server behind Caddy (TLS via ACME).
# Beforehand: create .env from .env.example and set TEAM_DOMAIN, PUBLIC_URL and the keys.
#   docker compose up -d --build
# Only Caddy is reachable from outside (80/443); the server listens only inside the Compose network.

services:
  server:
    build: .
    image: hangar-server:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      BIND_ADDR: 0.0.0.0:8080
      # Caddy appends the client address to X-Forwarded-For; that is the only reason we trust it.
      TRUST_PROXY: "true"
    volumes:
      - team-data:/data
    expose:
      - "8080"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          # 200 connections × up to 1 MiB read buffer plus state (docs/protocol.md).
          memory: 512M
    stop_grace_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TEAM_DOMAIN: ${TEAM_DOMAIN:?TEAM_DOMAIN missing in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  team-data:
  caddy-data:
  caddy-config:
