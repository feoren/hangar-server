# Betrieb auf einem VPS oder Docker-Host: Teamserver hinter Caddy (TLS per ACME).
# Vorher: .env aus .env.example anlegen und TEAM_DOMAIN, PUBLIC_URL, Schlüssel setzen.
#   docker compose up -d --build
# Nur Caddy ist von außen erreichbar (80/443); der Teamserver lauscht nur im Compose-Netz.

services:
  teamserver:
    build: .
    image: hangar-team-server:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      BIND_ADDR: 0.0.0.0:8080
      # Caddy hängt die Client-Adresse an X-Forwarded-For an; nur deshalb vertrauen wir ihr.
      TRUST_PROXY: "true"
    volumes:
      - team-data:/data
    expose:
      - "8080"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          # 200 Verbindungen × bis 1 MiB Lesepuffer plus Zustand (docs/protocol.md).
          memory: 512M
    stop_grace_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - teamserver
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TEAM_DOMAIN: ${TEAM_DOMAIN:?TEAM_DOMAIN fehlt in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  team-data:
  caddy-data:
  caddy-config:
