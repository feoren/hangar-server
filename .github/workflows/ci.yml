# Check pipeline from docs/development.md ("Building and checking"), plus known vulnerabilities in
# the dependencies and a test build of the Docker image.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The checks only read; a pull request from a fork gets no write permissions.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A hanging test must not occupy a runner for six hours.
    timeout-minutes: 45
    steps:
      # Third-party actions are pinned to a commit (a tag can be moved); Dependabot proposes
      # updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # --locked: the build uses exactly Cargo.lock and fails if it would have to change it.
      - name: Rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked --no-fail-fast

      # Cross-check of the ticket and license vectors with PHP/libsodium (like the website).
      - name: Test vectors (PHP)
        run: |
          php -m | grep -qi '^sodium$' || { echo "PHP without sodium"; exit 1; }
          php tools/php/verify_vectors.php testdata/tickets.json testdata/licenses.json

  # Known vulnerabilities in Cargo.lock. cargo-audit is installed in a fixed version from its own
  # lock file; it fails on vulnerabilities and only warns about unmaintained crates.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      # RUSTSEC-2026-0459 (bundled SQLite) has been assessed and accepted until sqlx has a version
      # with libsqlite3-sys >= 0.39 (docs/dependencies.md). Only this one ID is allowed; any other
      # finding fails the job. Remove the exception with the sqlx update.
      - name: Rust dependencies
        run: cargo audit --file Cargo.lock --ignore RUSTSEC-2026-0459

  # The image must build (amd64); nothing is published here.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build image
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build -t hangar-team-server:ci .
