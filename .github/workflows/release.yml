# Publishes the image for a release: a tag vX.Y.Z (the version in Cargo.toml) builds
# ghcr.io/<owner>/hangar-server:X.Y.Z for linux/amd64 and linux/arm64 and pushes it.
#
#   git tag v0.4.0 && git push github v0.4.0
#
# The arm64 half is compiled under QEMU (see Dockerfile): slow, but without a cross toolchain.
# There is deliberately no "latest" tag; installations name an exact version.
#
# The same build also yields the static binaries; they go to a GitHub release together with
# SHA256SUMS, install.sh and docker-compose.yml (README, "Set up your own server").
name: Release image

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # Nothing is published unless the tagged commit passes the tests and the dependency audit
  # (same rules as ci.yml), even if the tag was pushed while CI was red.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Tests
        run: cargo test --locked --no-fail-fast

      # RUSTSEC-2026-0459: assessed and accepted, see docs/dependencies.md and ci.yml.
      - name: Dependency audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file Cargo.lock --ignore RUSTSEC-2026-0459

  image:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The tag must match the version that the binary reports.
      - name: Version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$tag" != "$cargo_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi
          sh tools/check-versions.sh
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hangar-server" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The source label links the package to this repository on GitHub.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Elastic-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The binary stage of the same Dockerfile, served from the cache of the image build.
      - name: Binaries
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: binary
          outputs: type=local,dest=out
          cache-from: type=gha

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          cp out/linux_amd64/hangar-server dist/hangar-server-x86_64-linux-musl
          cp out/linux_arm64/hangar-server dist/hangar-server-aarch64-linux-musl
          cp install.sh docker-compose.yml dist/
          (cd dist && sha256sum hangar-server-* install.sh docker-compose.yml > SHA256SUMS)
          cat dist/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
