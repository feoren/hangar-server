# Proposes updates for the pinned actions, the Rust dependencies from Cargo.lock and the base
# images in the Dockerfile. Weekly and with few open pull requests so that every update stays
# reviewable. The app's crates under vendor/ are path dependencies and are updated by hand
# (docs/development.md, "Updating the crates").
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
