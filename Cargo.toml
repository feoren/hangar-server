[package]
name = "hangar-server"
version = "0.7.0"
description = "Relay and self-hosting identity of the Hangar team service"
edition = "2021"
rust-version = "1.88"
license = "Elastic-2.0"
publish = false

# Rationale, license and maintenance status of every dependency: docs/dependencies.md.
[dependencies]
# Wire format, keyed hashes and state machines (step C) plus the rules of the end-to-end
# encryption (step E, checking the membership log and the key packages). Both belong to the app
# (MIT) and are kept as unmodified copies under `vendor/` (origin and commit per crate in
# ORIGIN.md); new version: docs/development.md, "Updating the crates".
hangar-team-protocol = { path = "vendor/hangar-team-protocol" }
hangar-team-crypto = { path = "vendor/hangar-team-crypto" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws", "json", "form", "query", "matched-path"] }
# The HTTP server loop itself (`serve_until`): axum's `serve` sets no timer, so no deadline for
# request headers. Both are already in the tree through axum.
hyper = { version = "1.9", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["http1", "server", "service", "tokio"] }
# `Layer` to put the client address in front of the router, per connection.
tower = { version = "0.5", default-features = false }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ed25519-dalek = "2.2"
sha2 = "0.10"
hmac = "0.12"
subtle = "2.6"
base64 = "0.22"
getrandom = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "std"] }
dotenvy = "0.15"
# Fetching the website's revocation list (official mode only). rustls with ring like lettre,
# system root certificates; no redirects, time and size limits in the code.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
lettre = { version = "0.11.24", default-features = false, features = ["builder", "hostname", "smtp-transport", "pool", "tokio1", "tokio1-rustls-tls"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
